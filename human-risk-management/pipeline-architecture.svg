<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="580" fill="#ffffff"/>

  <!-- Tenant A card -->
  <g>
    <rect x="76" y="30" width="268" height="216" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="76" y="30" width="268" height="5" rx="2.5" fill="#c0135a"/>
    <text x="100" y="60" font-size="17" font-weight="700" fill="#1a1a1a">Tenant A</text>
    <text x="100" y="79" font-size="12" fill="#8a8a8a">identity tenant 1</text>

    <rect x="93" y="93" width="234" height="52" rx="6" fill="#f7f7f5"/>
    <text x="107" y="113" font-size="12.5" font-weight="700" fill="#1a1a1a">Entra ID directory</text>
    <text x="107" y="130" font-size="11" fill="#8a8a8a">Users · department · location</text>

    <rect x="93" y="158" width="234" height="52" rx="6" fill="#f7f7f5"/>
    <text x="107" y="178" font-size="12.5" font-weight="700" fill="#1a1a1a">Microsoft Graph API</text>
    <text x="107" y="195" font-size="11" fill="#8a8a8a">App registration #1 · scoped to Tenant A</text>
  </g>

  <!-- Tenant B card -->
  <g>
    <rect x="346" y="30" width="268" height="216" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="346" y="30" width="268" height="5" rx="2.5" fill="#1a1a1a"/>
    <text x="370" y="60" font-size="17" font-weight="700" fill="#1a1a1a">Tenant B</text>
    <text x="370" y="79" font-size="12" fill="#8a8a8a">identity tenant 2</text>

    <rect x="363" y="93" width="234" height="52" rx="6" fill="#f7f7f5"/>
    <text x="377" y="113" font-size="12.5" font-weight="700" fill="#1a1a1a">Entra ID directory</text>
    <text x="377" y="130" font-size="11" fill="#8a8a8a">Users · department · location</text>

    <rect x="363" y="158" width="234" height="52" rx="6" fill="#f7f7f5"/>
    <text x="377" y="178" font-size="12.5" font-weight="700" fill="#1a1a1a">Microsoft Graph API</text>
    <text x="377" y="195" font-size="11" fill="#8a8a8a">App registration #2 · scoped to Tenant B</text>
  </g>

  <!-- Tenant C card -->
  <g>
    <rect x="616" y="30" width="268" height="216" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="616" y="30" width="268" height="5" rx="2.5" fill="#b8860b"/>
    <text x="640" y="60" font-size="17" font-weight="700" fill="#1a1a1a">Tenant C</text>
    <text x="640" y="79" font-size="12" fill="#8a8a8a">identity tenant 3 (overseas entity)</text>

    <rect x="633" y="93" width="234" height="52" rx="6" fill="#f7f7f5"/>
    <text x="647" y="113" font-size="12.5" font-weight="700" fill="#1a1a1a">Entra ID directory</text>
    <text x="647" y="130" font-size="11" fill="#8a8a8a">Users · department · location</text>

    <rect x="633" y="158" width="234" height="52" rx="6" fill="#f7f7f5"/>
    <text x="647" y="178" font-size="12.5" font-weight="700" fill="#1a1a1a">Microsoft Graph API</text>
    <text x="647" y="195" font-size="11" fill="#8a8a8a">App registration #3 · scoped to Tenant C</text>
  </g>

  <!-- connector label -->
  <text x="480" y="270" font-size="12.5" fill="#8a8a8a" text-anchor="middle">nightly scheduled pull, one per tenant</text>

  <!-- connector lines from each card down into Dataverse -->
  <path d="M 210 246 L 210 285 Q 210 295 220 295 L 460 295" fill="none" stroke="#c0135a" stroke-width="2"/>
  <path d="M 480 246 L 480 305" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 750 246 L 750 285 Q 750 295 740 295 L 500 295" fill="none" stroke="#b8860b" stroke-width="2"/>
  <path d="M 480 305 L 480 318" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Dataverse box -->
  <rect x="240" y="320" width="480" height="80" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="240" y="320" width="480" height="5" fill="#1a1a1a"/>
  <text x="480" y="352" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Dataverse — unified store</text>
  <text x="480" y="371" font-size="11.5" fill="#8a8a8a" text-anchor="middle">Hosted in one tenant · every row stamped with source tenant</text>
  <text x="480" y="388" font-size="11.5" fill="#8a8a8a" text-anchor="middle">dim_person · fact_training_month · fact_phishing · ref_alias</text>

  <!-- arrow down to Power BI -->
  <path d="M 480 400 L 480 458" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Power BI box -->
  <rect x="313" y="465" width="334" height="80" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="313" y="465" width="334" height="5" fill="#b8860b"/>
  <text x="480" y="497" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Power BI report</text>
  <text x="480" y="516" font-size="11.5" fill="#8a8a8a" text-anchor="middle">One report, all entities · Tenant slicer = group-by on the stamp</text>

  <!-- caption -->
  <text x="480" y="572" font-size="12.5" font-style="italic" fill="#2f6f4f" text-anchor="middle">Three tenant-scoped Graph connections fan into one governed store, served by one report</text>
</svg>
